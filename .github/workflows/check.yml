name: MacBook Pro 在庫チェック

on:
  schedule:
    # 朝6-10時・夕方16-19時(日本時間)は10分おき
    - cron: "*/10 0-1,7-10,21-23 * * *"
    # それ以外の時間は30分おき
    - cron: "*/30 2-6,11-20 * * *"
  workflow_dispatch: {}

jobs:
  check-stock:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存ライブラリをインストール
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 在庫チェック実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check_stock.py

      - name: 状態ファイルの変更をコミット
        run: |
          git config user.name "stock-watcher-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update state.json [skip ci]"
          git push
